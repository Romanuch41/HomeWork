<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <div class="card-get-data">
            <div class="card-get-data__column1">
                <span>Registration form</span>
                <div class="card-get-data__column1__user-name">
                    <img src="icons/username.png" alt="">
                    <input type="text" placeholder="  Usernmae">
                </div>
                <div class="card-get-data__column1__email">
                    <img src="icons/email.png" alt="">
                    <input type="text" placeholder="  Email address">
                </div>
                <div class="card-get-data__column1__set_pass">
                    <img src="icons/pswd.png" alt="">
                    <input type="text" placeholder="  Password">
                    <input type="text" placeholder="  Confirm password">
                </div>
                <div class="card_get_data__column1__set-options">
                    <label><input type="checkbox">  i want to receiv mews and cpecial ofers</label>
                    <label><input type="checkbox">  i agree with the Tems and Condition</label>
                </div>
            </div>
            <div class="card-get-data__column2">
                <span>Personal details</span>
                <div class="card-get-data__column2__data-block-one">
                    <input type="text" placeholder="  First name">
                    <input type="text" placeholder="  Last name">
                </div>
                <div class="card-get-data__column2__data-block-two">
                    <select name="Male" id="1">
                        <option value="Man">Man</option>
                        <option value="Woman">Woman</option>
                    </select>
                    <input type="text" placeholder="  dd/mm/yyyy">
                </div>
            </div>
        </div>
        <div class="card-get-data__button">
            <button class="get-data">Sumbit</button>
        </div>
    </div>
</body>
</html>
