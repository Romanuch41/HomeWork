<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="credit-card">
        <div class="credit-card__title">
            <span>CREDIT CARD DETAILS</span>
        </div>
        <div class="credit-card__input">
            <span>Card number</span>
            <input type="text" class="credit-card__input__get-data" placeholder="1234 5678 9012 3456">
        </div>
        <div class="credit-card__input">
            <span>Card number</span>
            <input type="text" class="credit-card__input__get-data" placeholder="Name Surname">
        </div>
        <div class="credit-card__block-details">
            <div class="credit-card__input-titles">
                <span>Expiry Date</span>
                <span>CVV/CVN</span>
            </div>
            <div class="credit-card__input-dop">
                <input type="text" class="credit-card__input-dop__input-details" placeholder="02">
                <input type="text" class="credit-card__input-dop__input-details" placeholder="2017">
                <input type="text" class="credit-card__input-dop__input-details" placeholder="***">
            </div>
        </div>
        <div class="credit-card__image">
            <img src="icons/moon_flag.png" alt="moon_flag">
        </div>
    </div>
</body>
</html>
