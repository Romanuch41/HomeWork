<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<body>
    <main>
        <div class="login">
            <img src="image/lerning.jpg" alt="img">
            <div class="login__content">
                <span class="login__content__title">Welcome to lorem!</span>
                <div class="login__content-block-button">
                    <button >Login</button>
                    <button >Register</button>
                </div>
                <span class="login__content__context">Lorem ipsum is simply dummy text of the printing and typesetting industry</span>
                <span class="login__content__title-imput">User name</span>
                <input type="text" class="login__content__input_user">

                <button class="login__content__input-button">👁️</button>
                <div class="login__content__spec-button">
                    <input type="checkbox" class="login__content__spec-button-checkbox">
                    <span>Remember me</span>
                    <a class="login__content__spec-button-text-button" href="\\127.0.0.1">Forget password?</a>
